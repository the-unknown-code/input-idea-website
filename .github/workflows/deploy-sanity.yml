# This workflow deploys Sanity Studio to the cloud
#
# CUSTOMIZE FOR YOUR PROJECT:
# - Update 'paths' below to match where your Sanity files are located
# - Update workspace/package name in commands (e.g., @app/sanity, @your-org/sanity, or use relative paths)
# - Adjust commands based on your project structure (monorepo vs single package)
#
# Prerequisites:
# 1. Sanity Studio installed and configured in your project
# 2. GitHub secrets configured (see .github/SANITY_DEPLOYMENT.md)
# 3. Scripts available: typecheck, typegen, build, deploy (or adjust commands below)

name: Deploy Sanity

on:
  push:
    branches:
      - main
      - dev
    paths:
      # CUSTOMIZE: Update this path to match your Sanity location
      # Examples: 'packages/sanity/**', 'apps/studio/**', 'sanity/**', 'studio/**'
      - 'packages/sanity/**'
      - '.github/workflows/deploy-sanity.yml'
  workflow_dispatch:

jobs:
  deploy-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CUSTOMIZE: Adjust these commands based on your project structure
      #
      # For monorepo with workspace (pnpm/yarn/npm workspaces):
      #   pnpm --filter <workspace-name> <script>
      #
      # For monorepo with specific directory:
      #   cd packages/sanity && pnpm <script>
      #
      # For single package project:
      #   pnpm <script>
      #
      # Examples of workspace names: @app/sanity, @company/studio, studio

      - name: Typecheck Sanity
        # CUSTOMIZE: Change @app/sanity to your workspace name or use cd approach
        run: pnpm --filter @app/sanity typecheck

      - name: Generate types from schema
        # CUSTOMIZE: Change @app/sanity to your workspace name or use cd approach
        run: pnpm --filter @app/sanity typegen
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_STUDIO_API_VERSION: ${{ secrets.SANITY_API_VERSION }}

      - name: Build Sanity
        # CUSTOMIZE: Change @app/sanity to your workspace name or use cd approach
        run: pnpm --filter @app/sanity build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_STUDIO_API_VERSION: ${{ secrets.SANITY_API_VERSION }}

      - name: Deploy Sanity
        # CUSTOMIZE: Change @app/sanity to your workspace name or use cd approach
        run: pnpm --filter @app/sanity exec sanity deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_DATASET }}
          SANITY_STUDIO_API_VERSION: ${{ secrets.SANITY_API_VERSION }}
